# CI — lint, typecheck/build, unit + e2e tests
# Optional integration job with PostgreSQL service

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "12.14.0"

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (TypeScript)
        run: pnpm build

  unit-and-e2e:
    name: Unit & E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: |
          shopt -s globstar
          node --conditions=development --import tsx --test --test-reporter=spec src/**/*.test.ts

      - name: E2E tests
        run: |
          shopt -s globstar
          node --conditions=development --import tsx --test --test-reporter=spec test/e2e/**/*.test.ts

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: register-system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d register-system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: test
      LOG_LEVEL: silent
      HOST: 127.0.0.1
      PORT: 5000
      WEB_URL: http://127.0.0.1:5173
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: register-system
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SSLMODE: disable
      DATABASE_TIMEZONE: UTC
      REDIS_DB: 0
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      # 32-byte keys as base64 (test-only; do not use in production)
      JWT_SECRET_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      ENCRYPTION_KEY: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU=
      REFRESH_TOKEN_SECRET_KEY: QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVowMTIzNDU=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do
            echo "Waiting for Postgres..."
            sleep 1
          done

      - name: Install PostgreSQL client & run migrations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          # Apply migrations in order if present
          if [ -d database/migrations ]; then
            for f in database/migrations/V*.sql; do
              echo "→ $f"
              PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d register-system -v ON_ERROR_STOP=1 -f "$f"
            done
          fi

      - name: Integration tests
        run: |
          shopt -s globstar
          node --conditions=development --import tsx --test --test-reporter=spec test/integration/**/*.test.ts

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint-and-build, unit-and-e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: register-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
